<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management & Tracking | The Grand Aurelia</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <!-- Desktop Sidebar -->
        <aside class="dashboard-sidebar">
            <a href="index.html" class="sidebar-brand">
                <i class="bi bi-stars text-gold fs-4"></i>
                <div>
                    <span class="font-heading fw-bold fs-6 text-white d-block" style="letter-spacing: 0.05em;">THE GRAND AURELIA</span>
                    <small class="text-gold" style="font-size: 0.65rem; letter-spacing: 0.1em;">ORDERS & BILLING</small>
                </div>
            </a>
            <nav class="sidebar-nav" id="sidebarNavContainer"></nav>
            <div class="sidebar-footer">
                <button class="btn btn-sm btn-outline-danger w-100" onclick="AuthService.logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign Out
                </button>
            </div>
        </aside>

        <!-- Main Dashboard View -->
        <main class="dashboard-main">
            <!-- Topbar -->
            <header class="dashboard-topbar">
                <div>
                    <h4 class="font-heading fw-bold text-navy mb-0">Orders & Invoicing Pipeline</h4>
                    <small class="text-muted d-none d-sm-block">Track dining tickets, kitchen preparations, and tax receipts</small>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <a href="pos.html" class="btn btn-gold btn-sm d-none d-sm-inline-flex">
                        <i class="bi bi-receipt-cutoff me-1"></i>POS Terminal
                    </a>
                    <a href="kds.html" class="btn btn-outline-navy btn-sm d-none d-sm-inline-flex">
                        <i class="bi bi-fire me-1 text-danger"></i>Kitchen KDS
                    </a>
                    <div class="user-profile-widget"></div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="dashboard-content">
                
                <!-- Filter & Search Controls -->
                <div class="card-hotel p-3 mb-4 bg-white border">
                    <div class="row g-3 align-items-center justify-content-between">
                        <!-- Search Bar -->
                        <div class="col-12 col-md-5 col-lg-4">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-1" id="orderSearchInput" placeholder="Search by Order ID, guest, or table...">
                            </div>
                        </div>

                        <!-- Status Filter Pills -->
                        <div class="col-12 col-md-7 col-lg-8 text-md-end">
                            <div class="scroll-horizontal justify-content-md-end">
                                <button type="button" class="btn btn-sm btn-navy order-status-filter-btn active text-nowrap" data-status="All">All (<span id="ordersTotalCount">0</span>)</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary order-status-filter-btn text-nowrap" data-status="Pending">Pending</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary order-status-filter-btn text-nowrap" data-status="Confirmed">Confirmed</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary order-status-filter-btn text-nowrap" data-status="Preparing">Preparing</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary order-status-filter-btn text-nowrap" data-status="Ready for Pickup">Ready</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary order-status-filter-btn text-nowrap" data-status="Delivered">Delivered</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary order-status-filter-btn text-nowrap" data-status="Cancelled">Cancelled</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Desktop Table View -->
                <div class="card-hotel p-0 bg-white border d-none d-md-block overflow-hidden mb-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light small">
                                <tr>
                                    <th>Order Ref</th>
                                    <th>Guest Details</th>
                                    <th>Type / Location</th>
                                    <th>Items Ordered</th>
                                    <th>Amount</th>
                                    <th>Payment</th>
                                    <th>Status</th>
                                    <th class="text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="ordersTableBody">
                                <!-- Populated dynamically by OrdersModule.init() -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Mobile Responsive Cards View -->
                <div class="d-md-none" id="ordersMobileList">
                    <!-- Populated dynamically by OrdersModule.init() -->
                </div>

            </div>
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Modules -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Require login to track/manage orders
            if (AuthService.requireAuth()) {
                OrdersModule.init();
            }
        });
    </script>
</body>
</html>
