<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Inventory & Housekeeping | Maithili Agro Tourism</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="dashboard-wrapper">
        <aside class="dashboard-sidebar">
            <a href="index.html" class="sidebar-brand">
                <i class="bi bi-stars text-gold fs-4"></i>
                <div>
                    <span class="font-heading fw-bold fs-6 text-white d-block" style="letter-spacing: 0.05em;">MAITHILI</span>
                    <small class="text-gold" style="font-size: 0.65rem; letter-spacing: 0.1em;">AGRO TOURISM — MULSHI · PUNE</small>
                </div>
            </a>
            <nav class="sidebar-nav" id="sidebarNavContainer"></nav>
            <div class="sidebar-footer">
                <button class="btn btn-sm btn-outline-danger w-100" onclick="AuthService.logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>Sign Out
                </button>
            </div>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-topbar">
                <div>
                    <h4 class="font-heading fw-bold text-navy mb-0">Room Inventory & Housekeeping</h4>
                    <small class="text-muted d-none d-sm-block">Manage suite configurations, occupancy statuses, and cleaning turnover</small>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-gold btn-sm" onclick="DashboardModule.openAddRoomModal()">
                        <i class="bi bi-plus-lg"></i><span class="d-none d-sm-inline ms-1">New Suite</span>
                    </button>
                    <div class="user-profile-widget"></div>
                </div>
            </header>

            <div class="dashboard-content">
                <!-- Filter Pills -->
                <div class="card-hotel p-3 mb-4 bg-white border">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div class="d-flex gap-1 scroll-horizontal" id="roomCategoryFilters">
                            <button class="btn btn-sm btn-navy active-room-cat" onclick="filterRooms('All')">All Suites</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="filterRooms('Standard')">Standard</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="filterRooms('Deluxe')">Deluxe</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="filterRooms('Suite')">Suite / Penthouse</button>
                        </div>
                        <div class="small text-muted">
                            Total Suites: <strong class="text-navy" id="roomTotalCountDisplay">0</strong>
                        </div>
                    </div>
                </div>

                <!-- Desktop Rooms Table -->
                <div class="d-none d-md-block">
                    <div class="card-hotel p-0 bg-white border overflow-hidden mb-4">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light small">
                                    <tr>
                                        <th>Room No</th>
                                        <th>Suite Details</th>
                                        <th>Category</th>
                                        <th>Max Capacity</th>
                                        <th>Nightly Rate</th>
                                        <th>Live Status</th>
                                        <th class="text-end">Manage Status</th>
                                    </tr>
                                </thead>
                                <tbody id="roomsInventoryTableBody">
                                    <!-- Populated dynamically by script -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Mobile Responsive Cards List -->
                <div class="d-md-none mb-4" id="roomsInventoryMobileList">
                    <!-- Populated dynamically by script -->
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Modules -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/payments.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/bookings.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>

    <script>
        let currentFilter = 'All';

        document.addEventListener('DOMContentLoaded', () => {
            // Authorized roles: Admin, Manager, Receptionist
            if (AuthService.requireAuth(['Admin', 'Manager', 'Receptionist'])) {
                renderRoomsTable();
            }
        });

        function filterRooms(category) {
            currentFilter = category;
            const buttons = document.querySelectorAll('#roomCategoryFilters button');
            buttons.forEach(btn => {
                if (btn.textContent.includes(category) || (category === 'All' && btn.textContent.includes('All'))) {
                    btn.className = 'btn btn-sm btn-navy';
                } else {
                    btn.className = 'btn btn-sm btn-outline-secondary';
                }
            });
            renderRoomsTable();
        }

        function renderRoomsTable() {
            const tbody = document.getElementById('roomsInventoryTableBody');
            const mobileContainer = document.getElementById('roomsInventoryMobileList');
            const rooms = StorageService.get(STORAGE_KEYS.ROOMS, []);
            
            let filtered = rooms;
            if (currentFilter !== 'All') {
                filtered = rooms.filter(r => r.category === currentFilter);
            }

            document.getElementById('roomTotalCountDisplay').textContent = filtered.length;

            if (filtered.length === 0) {
                if (tbody) tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted small">No rooms found in category "${currentFilter}".</td></tr>`;
                if (mobileContainer) mobileContainer.innerHTML = `<div class="text-center py-4 text-muted small">No rooms found in category "${currentFilter}".</div>`;
                return;
            }

            let tableHtml = '';
            let cardsHtml = '';

            filtered.forEach(room => {
                let badgeClass = 'badge-available';
                if (room.status === 'Occupied') badgeClass = 'badge-occupied';
                if (room.status === 'Reserved') badgeClass = 'badge-pending';
                if (room.status === 'Cleaning') badgeClass = 'badge-cleaning';

                const statusDropdown = `
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" style="font-size:0.75rem;" data-bs-toggle="dropdown">
                            Set Status
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm small">
                            <li><a class="dropdown-item py-1" href="javascript:void(0)" onclick="setRoomStatus('${room.id}', 'Available')"><span class="badge-status badge-available me-1"></span>Available</a></li>
                            <li><a class="dropdown-item py-1" href="javascript:void(0)" onclick="setRoomStatus('${room.id}', 'Reserved')"><span class="badge-status badge-pending me-1"></span>Reserved</a></li>
                            <li><a class="dropdown-item py-1" href="javascript:void(0)" onclick="setRoomStatus('${room.id}', 'Occupied')"><span class="badge-status badge-occupied me-1"></span>Occupied</a></li>
                            <li><a class="dropdown-item py-1" href="javascript:void(0)" onclick="setRoomStatus('${room.id}', 'Cleaning')"><span class="badge-status badge-cleaning me-1"></span>Cleaning / Turnover</a></li>
                        </ul>
                    </div>
                `;

                // Desktop Table
                tableHtml += `
                    <tr>
                        <td class="fw-bold font-monospace text-navy fs-5">
                            <div class="d-flex align-items-center gap-2">
                                <img src="${room.image}" width="48" height="40" class="rounded" style="object-fit:cover;">
                                <span>#${room.number}</span>
                            </div>
                        </td>
                        <td>
                            <div class="fw-semibold text-dark">${room.type}</div>
                            <small class="text-muted">${room.size} • ${room.bedType}</small>
                        </td>
                        <td><span class="badge bg-light text-dark border">${room.category}</span></td>
                        <td><i class="bi bi-person me-1"></i>${room.capacity} Guests</td>
                        <td class="fw-bold text-navy">${App.formatCurrency(room.pricePerNight)}</td>
                        <td><span class="badge-status ${badgeClass}">${room.status}</span></td>
                        <td class="text-end">${statusDropdown}</td>
                    </tr>
                `;

                // Mobile Card
                cardsHtml += `
                    <div class="mobile-record-card">
                        <div class="d-flex align-items-center justify-content-between mb-2 pb-2 border-bottom">
                            <div class="d-flex align-items-center gap-2">
                                <img src="${room.image}" width="44" height="44" class="rounded" style="object-fit:cover;">
                                <div>
                                    <span class="fw-bold font-monospace text-navy">Room #${room.number}</span>
                                    <span class="badge bg-light text-dark border ms-1" style="font-size:0.65rem;">${room.category}</span>
                                </div>
                            </div>
                            <span class="badge-status ${badgeClass}">${room.status}</span>
                        </div>
                        <div class="mb-2">
                            <div class="fw-bold text-dark">${room.type}</div>
                            <small class="text-muted">${room.size} • ${room.bedType} • Up to ${room.capacity} Guests</small>
                        </div>
                        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                            <div>
                                <span class="fw-bold text-gold fs-5">${App.formatCurrency(room.pricePerNight)}</span>
                                <small class="text-muted">/ night</small>
                            </div>
                            <div>${statusDropdown}</div>
                        </div>
                    </div>
                `;
            });

            if (tbody) tbody.innerHTML = tableHtml;
            if (mobileContainer) mobileContainer.innerHTML = cardsHtml;
        }

        function setRoomStatus(roomId, newStatus) {
            const rooms = StorageService.get(STORAGE_KEYS.ROOMS, []);
            const idx = rooms.findIndex(r => r.id === roomId);
            if (idx > -1) {
                rooms[idx].status = newStatus;
                StorageService.set(STORAGE_KEYS.ROOMS, rooms);
                App.showToast(`Room #${rooms[idx].number} updated to ${newStatus}.`, 'info');
                renderRoomsTable();
            }
        }
    </script>
</body>
</html>
