<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Display System (KDS) | Maithili Agro Tourism</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="kds-body">

    <!-- KDS Header Bar -->
    <header class="kds-header d-flex flex-wrap align-items-center justify-content-between gap-3">
        <!-- Left: Brand & Title -->
        <div class="d-flex align-items-center gap-3">
            <a href="pos.html" class="d-flex align-items-center gap-2 text-decoration-none text-white">
                <i class="bi bi-fire text-gold fs-3"></i>
                <div>
                    <span class="font-heading fw-bold fs-5 text-white d-block" style="letter-spacing: 0.05em; line-height: 1;">MAITHILI</span>
                    <small class="text-gold" style="font-size: 0.65rem; letter-spacing: 0.15em;">AGRO TOURISM — MULSHI · PUNE</small>
                </div>
            </a>

            <div class="vr bg-secondary opacity-50 d-none d-sm-block" style="height: 28px;"></div>

            <div class="d-flex align-items-center gap-2">
                <span class="badge bg-danger rounded-pill fs-6 px-3 py-1" id="kdsActiveTicketsCount">0</span>
                <span class="text-white-50 small d-none d-md-inline">Active Kitchen Tickets</span>
            </div>
        </div>

        <!-- Center: Station Filters -->
        <div class="d-flex align-items-center gap-1 scroll-horizontal">
            <button type="button" class="btn btn-sm btn-gold kds-station-filter-btn" data-station="All" onclick="KDSModule.setStationFilter('All')">
                All Stations
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary text-white kds-station-filter-btn" data-station="Mains" onclick="KDSModule.setStationFilter('Mains')">
                Hot Grill / Mains
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary text-white kds-station-filter-btn" data-station="Pantry" onclick="KDSModule.setStationFilter('Pantry')">
                Appetizers / Pantry
            </button>
            <button type="button" class="btn btn-sm btn-outline-secondary text-white kds-station-filter-btn" data-station="Bar" onclick="KDSModule.setStationFilter('Bar')">
                Bar & Beverages
            </button>
        </div>

        <!-- Right Controls -->
        <div class="d-flex align-items-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" onclick="KDSModule.playChime()" title="Test Sound Chime">
                <i class="bi bi-volume-up me-1"></i>Sound
            </button>
            <button type="button" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" onclick="KDSModule.toggleFullScreen()" title="Toggle Fullscreen">
                <i class="bi bi-arrows-fullscreen me-1"></i>Fullscreen
            </button>
            <a href="pos.html" class="btn btn-gold btn-sm rounded-pill px-3 py-1">
                <i class="bi bi-receipt-cutoff me-1"></i>POS Terminal
            </a>
            <a href="dashboard.html" class="btn btn-outline-danger btn-sm rounded-circle p-0 d-flex align-items-center justify-content-center" style="width:32px; height:32px;" title="Exit KDS">
                <i class="bi bi-x-lg"></i>
            </a>
        </div>
    </header>

    <!-- Top Summary Bar: Active Items to Cook -->
    <div class="px-3 py-2 bg-navy-dark border-bottom border-secondary border-opacity-25 d-flex align-items-center gap-2 overflow-x-auto" id="kdsActiveCookingSummary">
        <!-- Populated dynamically by kds.js -->
        <span class="text-muted small">Loading kitchen tickets...</span>
    </div>

    <!-- Main KDS Tickets Grid -->
    <main class="kds-board" id="kdsBoardGrid">
        <!-- Rendered dynamically by kds.js -->
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App Modules -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/kds.js"></script>
    <script src="js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Require Staff Authentication: Admin, Manager, Waiter
            if (AuthService.requireAuth(['Admin', 'Manager', 'Waiter'])) {
                KDSModule.init();
            }
        });
    </script>
</body>
</html>
